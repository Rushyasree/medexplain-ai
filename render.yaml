services:
  - type: web
    runtime: docker
    name: medexplain-ai
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /_stcore/health
    envVars:
      - key: MEDEXPLAIN_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
