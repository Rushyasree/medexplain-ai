services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medexplain
      POSTGRES_USER: medexplain
      POSTGRES_PASSWORD: medexplain_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
